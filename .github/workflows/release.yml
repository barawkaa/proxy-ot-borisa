name: Archive verified versions
on:
  workflow_run:
    workflows: [Verify complete application]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const sha=context.payload.workflow_run.head_sha;
            for (const [tag,target] of [['v4.0.2','698c57b79fe8bd126aaffc1b53147c0024eb3032'],['v5.0',sha]]) {
              try { await github.rest.git.getRef({owner,repo,ref:`tags/${tag}`}); }
              catch(e) { if(e.status!==404) throw e; await github.rest.git.createRef({owner,repo,ref:`refs/tags/${tag}`,sha:target}); }
            }
            try { await github.rest.repos.getReleaseByTag({owner,repo,tag:'v5.0'}); }
            catch(e) {
              if(e.status!==404) throw e;
              await github.rest.repos.createRelease({owner,repo,tag_name:'v5.0',name:'Proxy от Бориса 5.0',body:'Полная переработка приложения. Проверки и ARM64-сборка: '+context.payload.workflow_run.html_url+'\n\nПеред обновлением создайте резервную копию дополнения Home Assistant. Откат: docs/ROLLBACK.md. Проверка в домашней сети и на реальном HA OS выполняется отдельно.',draft:false,prerelease:false});
            }
