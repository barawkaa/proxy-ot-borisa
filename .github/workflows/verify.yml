name: Verify complete application
on:
  push:
    branches: [main, release/5.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r proxy-ot-borisa/requirements.txt ruff==0.14.0
      - name: Download pinned engines
        run: |
          mkdir engines
          curl --fail --location --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.12.12/sing-box-1.12.12-linux-amd64.tar.gz -o engines/sb.tar.gz
          curl --fail --location --retry 3 https://github.com/dolonet/mtg-multi/releases/download/v1.12.0/mtg-multi-1.12.0-linux-amd64.tar.gz -o engines/mtg.tar.gz
          tar -xzf engines/sb.tar.gz -C engines
          tar -xzf engines/mtg.tar.gz -C engines
      - name: Unit and real proxy integration tests
        env:
          PYTHONPATH: proxy-ot-borisa
          CORE_INTEGRATION: '1'
          SINGBOX_BIN: ${{ github.workspace }}/engines/sing-box-1.12.12-linux-amd64/sing-box
          MTG_BIN: ${{ github.workspace }}/engines/mtg-multi-1.12.0-linux-amd64/mtg-multi
        run: |
          python -m compileall -q proxy-ot-borisa/boris
          ruff check proxy-ot-borisa/boris --select F
          node --check proxy-ot-borisa/ui/app.js
          python -m unittest discover -s proxy-ot-borisa/tests -v
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: proxy-ot-borisa
          platforms: linux/arm64
          push: false
          tags: proxy-boris:5.1
          outputs: type=docker,dest=/tmp/proxy-boris-5.1.tar
      - name: Boot the ARM64 image and check the application
        run: |
          docker load -i /tmp/proxy-boris-5.1.tar
          docker run -d --name boris-smoke --network host proxy-boris:5.1
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8099/api/state -o /tmp/state.json && python3 -c 'import json; s=json.load(open("/tmp/state.json")); assert s["booted"] and s["runtime"]["core"] and s["version"]=="5.1"'; then break; fi
            sleep 1
          done
          python3 -c 'import json; s=json.load(open("/tmp/state.json")); assert s["booted"] and s["runtime"]["core"]'
          docker stop boris-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-boris-5.1-arm64
          path: /tmp/proxy-boris-5.1.tar
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r proxy-ot-borisa/requirements.txt
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile interaction test
        run: |
          python proxy-ot-borisa/tests/ui_fixture.py > /tmp/ui-fixture.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18099/healthz && break || sleep 1; done
          node proxy-ot-borisa/tests/ui_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: /tmp/ui-*.png
          retention-days: 7
